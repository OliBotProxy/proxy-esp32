[platformio]
default_envs = esp32-s3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1

; Generic ESP32-S3 (e.g. SparkleIoT XH-S3E and similar WROOM-1-based S3 modules)
; WiFi + plain TCP, same as esp32dev. Uses the standard devkitc-1 board def —
; works for bare ESP32-S3-WROOM-1 modules regardless of breakout brand.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-P4-ETH — IP101 PHY, 100 Mbps, PoE
; Uses esp32-p4-evboard as the closest PlatformIO board (same pinout, different PHY IC).
; BOARD_WAVESHARE_ESP32P4_ETH overrides the PHY type to IP101 in main.cpp.
[env:waveshare-esp32p4-eth]
platform = espressif32
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DUSE_ETHERNET=1
  -DUSE_TLS_TUNNEL=1
  -DBOARD_WAVESHARE_ESP32P4_ETH=1
