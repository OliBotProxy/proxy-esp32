[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1

; ESP32-P4 with Ethernet + TLS tunnel (port 8778)
; Board ID may need adjusting — check espressif32 platform release notes for P4 support.
[env:esp32p4-eth]
platform = espressif32
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_ARDUHAL_LOG_COLORS=1
  -DUSE_ETHERNET=1
  -DUSE_TLS_TUNNEL=1
